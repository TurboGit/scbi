[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scbi"
dynamic = ["version"]
description = "Source Code Build Infrastructure (Python driver)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scbi-py = "scbi.cli:main"

[tool.setuptools.dynamic]
version = {attr = "scbi.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
markers = [
    "oracle: differential test comparing with the Bash implementation",
]

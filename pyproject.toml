[build-system]
#  77: license as an SPDX expression (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scbi"
dynamic = ["version"]
description = "Source Code Build Infrastructure (Python driver)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scbi-py = "scbi.cli:main"

[tool.setuptools.dynamic]
version = {attr = "scbi.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
#  the unit tests and the regression drivers (tests/drivers/testNNN.py)
python_files = ["test_*.py", "test[0-9][0-9][0-9].py"]
junit_family = "xunit2"

[tool.setuptools.package-data]
scbi = ["hooks/*.sh"]

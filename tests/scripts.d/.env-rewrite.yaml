#  Environment of test050: the vcs records are rewritten
functions:
  rewrite-vcs:
    params: [PROXY, OPTIONS, PROTOCOL, URL, DIR]
    run: |-
      U = ${URL/\/this.is.path/$TESTREPOS}
      U = ${U/some\/dir/lib1.bundle}
      echo $PROXY
      echo $OPTIONS
      echo $PROTOCOL
      echo $U
      if not empty($DIR):
          echo $DIR

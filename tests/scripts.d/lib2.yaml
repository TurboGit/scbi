plugin: lib2

vcs:
  proxy: default
  options: none
  protocol: git
  url: ${TESTREPOS}/lib2.bundle

env:
  - add-to-var C_INCLUDE_PATH $PREFIX/include
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var LIBRARY_PATH $PREFIX/lib

build-env:
  - export C_INCLUDE_PATH $PWD/include:$C_INCLUDE_PATH
  - export LIBRARY_PATH .:$PWD/lib:$LIBRARY_PATH
  - export LD_LIBRARY_PATH .:$PWD/lib:$LD_LIBRARY_PATH

out-of-tree: false

config:
  _: echo '#define VARIANT "default"' > config.h
  variant1: echo '#define VARIANT "variant1"' > config.h

build: make

install: |-
  mkdir -p $PREFIX/include
  mkdir -p $PREFIX/lib
  cp liblib2.so $PREFIX/lib
  cp lib2.h $PREFIX/include

tests: |-
  ./main2
  if is-file(./main2):
      return 0
  else:
      return 1

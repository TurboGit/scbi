plugin: multpatch

vcs:
  proxy: default
  options: none
  protocol: git
  url: ${TESTREPOS}/lib1.bundle

patches:
  - if version(lib2) =~ 2.0: patch-for-v2
  - if not (version(lib2) =~ 2.0): patch-for-v1
  - if version(lib2) > 1.9: patch-for-v2.2
  - if not (version(lib2) > 1.9): patch-for-v1.2
  - if version(lib2) > 1.9: patch-for-v2.3
  - if not (version(lib2) > 1.9): patch-for-v1.3

depends:
  - lib2

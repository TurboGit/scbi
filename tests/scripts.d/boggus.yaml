plugin: boggus

vcs:
  proxy: default
  options: none
  protocol: git
  url: ${TESTREPOS}/lib1.bundle

archive:
  proxy: default
  options: none
  protocol: none
  url: none
  file: boggus-$VERSION-src.tar.bz2

depends:
  - doesnotexists

out-of-tree: false

build: |-
  rm -f *.o
  make

install: |-
  mkdir -p $PREFIX/include
  mkdir -p $PREFIX/lib
  copy liblib1.so $PREFIX/lib
  copy lib1.h $PREFIX/include

tests: |-
  ./main
  return 0

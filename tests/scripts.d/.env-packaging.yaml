      for M V K R in $(module-ref metaagg):
          TVDIR = target-dir metaagg $V
      echo "R m:$MODULE v:$VARIANT d:$DEPENDS_KIND m:$IS_META a:$IS_AGGREGATED i:$IS_UP_TO_DATE"
      echo "Copy $PREFIX"
      echo "To $TVDIR/app"

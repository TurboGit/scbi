plugin: test18

vcs:
  proxy: default
  options: none
  protocol: git
  url: ${TESTREPOS}/test1.bundle

out-of-tree: false

config: ./configure

build: make

install: |-
  mkdir -p $PREFIX/bin $PREFIX/include
  copy main $PREFIX/bin
  copy incl.h $PREFIX/include

prefix:
  _: NONE
  alt: $SCBI_BDIR/local-install

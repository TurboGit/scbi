plugin: mspace

config-options:
  common:
    - one
    - two
  opta:
    - -DLIB=-L/usr/lib -lmpi_cxx -lmpi
  optb:
    - -DLIB=-lz1 -lz2 -lz3

config:
  opta: |-
    #  one option per line, prefixed by a letter: A, B, C...
    OPTIONS = config-options
    printf '%s\n' $OPTIONS | awk '{printf "%c %s\n", 64 + NR, $0}'
  optb: |-
    OPTIONS = config-options
    printf '%s\n' $OPTIONS | awk '{printf "%c %s\n", 64 + NR, $0}'

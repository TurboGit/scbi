#  Environment of test173: the env actions of lib1/dv (env and build-env
#  hooks) replayed through module-final-step, written to env.dump
functions:
  module-final-step:
    run: |-
      if $MODULE != m-lib1:
          return
      MDIR = $SCBI_BDIR/m-lib1
      : > $MDIR/env.dump
      for HOOK in env build-env:
          for A V X in $(env-actions $HOOK lib1/dv):
              echo "A:$A $V = ${X#$MDIR}" >> $MDIR/env.dump

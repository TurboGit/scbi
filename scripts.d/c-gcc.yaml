plugin: c-gcc

vcs:
  proxy: default
  options: none
  protocol: git
  url: git+ssh://git.adacore.com/gcc

build-env:
  - system-compiler

config-options:
  - --prefix=$PREFIX
  - --build=$TARGET
  - --target=$TARGET
  - --disable-multilib
  - --disable-libada
  - --disable-nls
  - --enable-languages=c,c++

config: |-
  ../src/configure $(config-options)

build: make -j$SCBI_JOBS

install: make install

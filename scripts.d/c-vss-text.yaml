plugin: c-vss-text

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/vss-text

build-depends:
  - p-gnat
  - c-gprbuild

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

build: make -j1 build-all-libs

install: make -j1 PREFIX=$PREFIX install-all-libs

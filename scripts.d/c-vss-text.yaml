plugin: c-vss-text

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/vss-text

build-depends:
  - c-sandbox
  - p-gnat
  - host@c-gprbuild

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

build:
  _: make -j1 build-all-libs
  cross: make -j1 GPRFLAGS="--target=$TARGET" build-all-libs

install:
  _: make -j1 PREFIX=$PREFIX install-all-libs
  cross: make -j1 PREFIX=$PREFIX GPRFLAGS="--target=$TARGET" install-all-libs

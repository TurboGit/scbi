plugin: c-python3-modules

env:
  - PYDIR = $(last-modified-directory $PREFIX/local/lib/python*)
  - add-to-var PYTHONPATH $PYDIR/dist-packages

out-of-tree: false

only-explicit-build: true

config-options:
  net:
    - websocket-client

install: |-
  MODULES_LIST =
  pip3 install $(config-options) --prefix $PREFIX

prefix: NONE

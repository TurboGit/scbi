plugin: c-prettier-ada

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/prettier-ada

patches:
  cross: cross-prettier-ada.patch

depends:
  - c-vss-text
  - c-gnatcoll-core

build-depends:
  - c-sandbox
  - p-gnat
  - host@c-gprbuild

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

build:
  _: make all
  cross: make GPRFLAGS="--target=$TARGET" all

install:
  _: make PREFIX=$PREFIX install-all
  cross: make PREFIX=$PREFIX GPRFLAGS="--target=$TARGET" install-all

prefix: NONE

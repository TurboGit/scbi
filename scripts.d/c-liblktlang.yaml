plugin: c-liblktlang

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/langkit

depends:
  - c-langkit-support

build-depends:
  - c-sandbox
  - p-gnat
  - host@c-gprbuild
  - c-e3
  - c-langkit-support

env:
  - add-to-var PATH $PREFIX/bin
  - add-to-var PYTHONPATH $PREFIX/python
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

build-env:
  cross:
    _:
      #  lkm cannot give the target to gprinstall: gprbuild and gprinstall
      #  use the configuration for the target (pre-build) of GPR_CONFIG
      - set-var GPR_CONFIG $(module-dir c-liblktlang build)/$TARGET.cgpr

out-of-tree: false

config: |-
  cd lkt
  delete build
  ln -s bootstrap build

pre-build:
  cross:
    _: gprconfig --batch --target=$TARGET --config=Ada --config=C -o $GPR_CONFIG

build: python3 -m langkit.scripts.lkm build -c lkt/langkit.yaml --library-types=static,static-pic,relocatable --disable-all-mains

install: python3 -m langkit.scripts.lkm install -c lkt/langkit.yaml --library-types=static,static-pic,relocatable --disable-all-mains $PREFIX

prefix: NONE

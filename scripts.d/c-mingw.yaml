plugin: c-mingw

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/mingw-w64/mingw-w64

depends:
  - c-mingw-header

build-depends:
  - c-sandbox
  - c-pgcc

setup: |-
  if $TARGET =~ "^(?:.*mingw.*)$":
      true
  else:
      echo $TARGET not supported for mingw.
      return 1

out-of-tree: true

config-options:
  - --prefix=$PREFIX
  - --host=$TARGET
  - --build=$SCBI_HOST
  - --enable-wildcard
  #  the compiler (c-pgcc) is not multilib: only the libraries of the
  #  target, this also avoids dlltool temporary files clashes between the
  #  lib32 and lib64 libraries built in parallel (same --temp-prefix)
  - if target =~ ^x86_64: --disable-lib32
  - if target =~ ^i686: --disable-lib64

config: ../src/mingw-w64-crt/configure $(config-options)

build: make -j$SCBI_JOBS

install: make install

prefix: $SCBI_PREFIX/$TARGET

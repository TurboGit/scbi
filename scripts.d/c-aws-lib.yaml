plugin: c-aws-lib

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/aws

depends:
  - c-xmlada

build-depends:
  common:
    - c-sandbox
    - p-gnat
  _:
    - c-gprbuild

env:
  - add-to-var PATH $PREFIX/bin
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr

out-of-tree: false

config-options:
  common:
    - prefix=$PREFIX
    - DEBUG=$(get-build-type MAKE true)
  gnutls:
    - SOCKET=gnutls
  openssl:
    - SOCKET=openssl

config:
  _: delete makefile.setup && make $(config-options) setup
  cross:
    _: delete makefile.setup && make LAL=false ZLIB=false TARGET=$TARGET $(config-options) setup

build:
  _: make build-lib-native
  cross:
    _: make TARGET=$TARGET build-lib-cross

install:
  _: make install-lib-native
  cross:
    _: make TARGET=$TARGET install-lib-cross

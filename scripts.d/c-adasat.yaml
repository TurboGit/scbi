plugin: c-adasat

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/adasat

build-depends:
  _:
    - p-gnat
    - host@c-gprbuild
  cross:
    _:
      - c-sandbox
      - p-gnat
      - host@c-gprbuild

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

build:
  _: make INSTALL_DIR=$PREFIX all-libs
  cross:
    _: make INSTALL_DIR=$PREFIX GPRBUILD_ARGS=--target=$TARGET all-libs

install:
  _: make INSTALL_DIR=$PREFIX install
  cross:
    #  the install rule has no variable to give the target to gprinstall
    _: |-
      GOPTS = -p -f --target=$TARGET -XBUILD_MODE=dev --prefix=$PREFIX --build-var=LIBRARY_TYPE
      for kind in static static-pic relocatable:
          gprinstall $GOPTS -P adasat.gpr -XLIBRARY_TYPE=$kind --build-name=$kind || return 1
      true

prefix: NONE

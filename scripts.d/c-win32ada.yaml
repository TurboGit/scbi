plugin: c-win32ada

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/win32ada

build-depends:
  cross:
    _:
      - c-sandbox
      - p-gnat

out-of-tree: false

build:
  _: make PROCESSORS=$SCBI_JOBS prefix=$PREFIX build
  cross:
    _: make PROCESSORS=$SCBI_JOBS prefix=$PREFIX TARGET=$TARGET DEBUG=false build

install:
  _: make prefix=$PREFIX install
  cross:
    _: make prefix=$PREFIX TARGET=$TARGET DEBUG=false install

version: |-
  write prj.gpr:
      with "win32ada";
      project prj is
      end prj;
  write main.adb:
      with win32;
      procedure main is
         n : win32.dword;
      begin
         null;
      end main;
  if ok("gprbuild -p -q $(if cross then --target=$TARGET) prj.gpr -cargs -gnatwA 2> /dev/null"):
      echo $VERSION_OK
  else:
      echo $VERSION_ERROR

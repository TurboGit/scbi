plugin: c-aws-tools

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/aws

depends:
  - c-xmlada
  - c-aws-lib
  - c-libadalang

build-depends:
  common:
    - c-sandbox
    - p-gnat
  _:
    - host@c-gprbuild
    - c-libadalang-tools

tests-depends:
  - c-sandbox
  - c-e3
  - c-python3-modules/net

env:
  - add-to-var PATH $PREFIX/bin
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr

out-of-tree: false

config-options:
  common:
    - prefix=$PREFIX
    - DEBUG=$(get-build-type MAKE true)
  gnutls:
    - SOCKET=gnutls
  openssl:
    - SOCKET=openssl

config:
  _: delete makefile.setup && make $(config-options) setup
  cross:
    _: delete makefile.setup && make LAL=false ZLIB=false TARGET=$TARGET $(config-options) setup

build:
  _: make build-tools-native
  cross:
    _: |-
      #  the templates of the tools are generated by awsres, a native tool:
      #  the one of the native build of this module (built first)
      AWSRES = $SCBI_BDIR/c-aws-tools/$SCBI_HOST-default/install/bin/awsres
      if not is-file($AWSRES):
          log 1 $AWSRES not found: build c-aws-tools for $SCBI_HOST first
          return 1
      mkdir -p $TARGET/common/src
      $AWSRES -r wsdl2aws_templates -o $TARGET/common/src tools/wsdl2aws-templates/*.tad[sb] tools/wsdl2aws-templates/*.macros || return 1
      make TARGET=$TARGET build-tools-cross

install:
  _: make install-tools-native
  cross:
    _: make TARGET=$TARGET install-tools-cross

tests: |-
  OPTIONS = "$OPTIONS"
  cd regtests && delete-tree results && mkdir results && ./gen_system_tags.py ../$TARGET/makefile.setup ../$TARGET/testsuite.tags && ./testsuite.py --jobs=$SCBI_JOBS --temp-dir=$PWD/results --target-dir=../$TARGET $OPTIONS

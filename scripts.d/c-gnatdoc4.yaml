plugin: c-gnatdoc4

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/gnatdoc

depends:
  - c-gpr2-lib
  - c-libadalang
  - c-langkit
  - c-vss
  - c-markdown

build-depends:
  - p-gnat
  - host@c-gprbuild

env:
  - add-to-var PATH $PREFIX/bin
  - add-to-var GPR_PROJECT_PATH $PREFIX/gnat

build-env:
  - set-var GPR2_LIBRARY_TYPE static

out-of-tree: false

pre-config: |-
  MKD = ${SCBI_MODULES_DIR[c-markdown@src]}
  copy $MKD subprojects/markdown

build: make INSTALL_DIR=$PREFIX

install: |-
  mkdir -p $PREFIX
  copy bin $PREFIX && copy .objs $PREFIX && copy source $PREFIX && copy gnat $PREFIX

prefix: NONE

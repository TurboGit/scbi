plugin: c-wposix

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/wposix

depends:
  - c-win32ada

build-depends:
  cross:
    _:
      - c-sandbox

out-of-tree: false

config:
  _: make prefix=$PREFIX DEBUG=false setup
  cross:
    _: make TARGET=$TARGET prefix=$PREFIX DEBUG=false setup

build:
  _: make PROCESSORS=$SCBI_JOBS
  cross:
    _: |-
      if $TARGET =~ "^(?:.*mingw.*)$":
          make
      else:
          echo Cannot build for target : $TARGET
          false

install: make install

version: |-
  write prj.gpr:
      with "wposix";
      project prj is
      end prj;
  write main.adb:
      with posix;
      procedure main is
         b : posix.filename_truncation := true;
      begin
         null;
      end main;
  if ok("gprbuild -p -q $(if cross then --target=$TARGET) prj.gpr -cargs -gnatwA 2> /dev/null"):
      echo $VERSION_OK
  else:
      echo $VERSION_ERROR

plugin: c-gpr2-lib

functions:
  do-gpr2-lib-config:
    params:
      - PREFIX
      - TARGET
      - BUILD
    run: make $BUILD prefix=$PREFIX GPR2KBDIR=${SCBI_MODULES_DIR[c-gprconfig-kb@src]}/db PYTHON=python3 setup

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/gpr

depends:
  - c-gnatcoll-core
  - c-gnatcoll-bindings-iconv
  - c-gnatcoll-bindings-gmp

build-depends:
  - p-gnat
  - c-gprbuild
  - c-e3
  - c-adasat
  - c-gprconfig-kb

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

config:
  _: do-gpr2-lib-config $PREFIX $TARGET "BUILD=release"
  debug: do-gpr2-lib-config $PREFIX $TARGET "BUILD=debug"

build: make build-lib-relocatable build-lib-static-pic build-lib-static

install: make GPRINSTALL=gprinstall install-lib-relocatable install-lib-static-pic install-lib-static

prefix: NONE

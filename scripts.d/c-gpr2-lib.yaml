plugin: c-gpr2-lib

functions:
  do-gpr2-lib-config:
    params:
      - PREFIX
      - TARGET
      - BUILD
    run: make $BUILD prefix=$PREFIX $(if cross then TARGET=$TARGET) GPR2KBDIR=$(module-dir c-gprconfig-kb src)/db PYTHON=python3 setup

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/gpr

depends:
  - c-gnatcoll-core
  - c-gnatcoll-bindings-iconv
  - c-gnatcoll-bindings-gmp

build-depends:
  - c-sandbox
  - p-gnat
  - host@c-gprbuild
  - c-e3
  - c-adasat
  - c-gprconfig-kb

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

config:
  _: do-gpr2-lib-config $PREFIX $TARGET "BUILD=release"
  debug: do-gpr2-lib-config $PREFIX $TARGET "BUILD=debug"

build:
  _: make build-lib-relocatable build-lib-static-pic build-lib-static
  cross:
    _: make TARGET=$TARGET build-lib-relocatable build-lib-static-pic build-lib-static
install:
  _: make GPRINSTALL=gprinstall install-lib-relocatable install-lib-static-pic install-lib-static
  cross:
    _: make TARGET=$TARGET GPRINSTALL=gprinstall install-lib-relocatable install-lib-static-pic install-lib-static

prefix: NONE

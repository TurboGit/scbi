plugin: c-gnatcoll-bindings-readline

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/gnatcoll-bindings

depends:
  common:
    - c-gnatcoll-core
  cross:
    _:
      - c-readline

build-depends:
  _:
    - p-gnat
    - c-gprbuild
  cross:
    _:
      - c-sandbox

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

build: |-
  GOPTS = "-j$SCBI_JOBS -p -XBUILD=PROD --target=$TARGET"
  for kind in static relocatable static-pic:
      gprbuild $GOPTS -XLIBRARY_TYPE=$kind readline/gnatcoll_readline.gpr || return 1

pre-install:
  _: |-
    gprinstall $GOPTS --uninstall gnatcoll_readline
    true
  cross:
    _: |-
      gprinstall $GOPTS --target=$TARGET --uninstall gnatcoll_readline
      true

install:
  _: |-
    GOPTS = "-p -f --prefix=$PREFIX -XBUILD=PROD --target=$TARGET"
    GOPTS = "$GOPTS --build-var=LIBRARY_TYPE"
    for kind in static relocatable static-pic:
        gprinstall $GOPTS -XLIBRARY_TYPE=$kind --build-var=GNATCOLL.READLINE_BUILD --install-name=gnatcoll_readline --build-name=$kind readline/gnatcoll_readline.gpr || return 1
  cross:
    _: |-
      GOPTS = "-p -f --prefix=$PREFIX -XBUILD=PROD --target=$TARGET"
      GOPTS = "$GOPTS --build-var=LIBRARY_TYPE --target=$TARGET"
      for kind in static relocatable static-pic:
          gprinstall $GOPTS -XLIBRARY_TYPE=$kind --build-var=GNATCOLL.READLINE_BUILD --install-name=gnatcoll_readline --build-name=$kind readline/gnatcoll_readline.gpr || return 1

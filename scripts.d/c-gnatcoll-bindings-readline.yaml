plugin: c-gnatcoll-bindings-readline

#  the options shared by gprbuild and gprinstall
vars:
  GOPTS:
    - -XBUILD=PROD
    - --target=$TARGET

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/gnatcoll-bindings

depends:
  common:
    - c-gnatcoll-core
  cross:
    _:
      - c-readline

build-depends:
  _:
    - p-gnat
    - c-gprbuild
  cross:
    _:
      - c-sandbox

env:
  - add-to-var GPR_PROJECT_PATH $PREFIX/share/gpr
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib

out-of-tree: false

build: |-
  for kind in static relocatable static-pic:
      gprbuild -j$SCBI_JOBS -p $GOPTS -XLIBRARY_TYPE=$kind readline/gnatcoll_readline.gpr || return 1

pre-install: |-
  gprinstall --prefix=$PREFIX $GOPTS --uninstall gnatcoll_readline
  true

install: |-
  GOPTS += -p -f --prefix=$PREFIX --build-var=LIBRARY_TYPE
  for kind in static relocatable static-pic:
      gprinstall $GOPTS -XLIBRARY_TYPE=$kind --build-var=GNATCOLL.READLINE_BUILD --install-name=gnatcoll_readline --build-name=$kind readline/gnatcoll_readline.gpr || return 1

plugin: c-clang

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/llvm/llvm-project.git

build-depends:
  - cmake

env:
  - add-to-var PATH $PREFIX/bin

config: cmake -G "Unix Makefiles" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=$(get-build-type CMAKE Release) -DLLVM_ENABLE_PROJECTS="clang" -DLLVM_ENABLE_DUMP=ON -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_INSTALL_UTILS=ON -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;NVPTX;X86" ../src/llvm

build: make -j$SCBI_JOBS

install: make install

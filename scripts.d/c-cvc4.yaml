plugin: c-cvc4

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/AdaCore/cvc4

depends:
  - antlr3
  - libantlr3c-dev
  - libboost-dev
  - python-toml

build-depends:
  - c-sandbox/system

out-of-tree: false

config: ./configure.sh --prefix=$PREFIX

build: cd build && make -j$SCBI_JOBS

install: cd build && make install

plugin: c-libiconv

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://git.savannah.gnu.org/git/libiconv.git

archive:
  proxy: default
  options: none
  protocol: curl
  url: http://ftp.gnu.org/gnu/libiconv
  file: libiconv-$VERSION.tar.gz

depends:
  - groff
  - gperf

build-depends:
  - c-sandbox

env:
  _:
    - add-to-var C_INCLUDE_PATH $PREFIX/include
    - add-to-var CXX_INCLUDE_PATH $PREFIX/include
    - add-to-var LD_LIBRARY_PATH $PREFIX/lib
    - add-to-var LIBRARY_PATH $PREFIX/lib
  cross:
    - add-to-var C_INCLUDE_PATH $PREFIX/$TARGET/include
    - add-to-var CXX_INCLUDE_PATH $PREFIX/$TARGET/include
    - add-to-var LD_LIBRARY_PATH $PREFIX/$TARGET/lib
    - add-to-var LIBRARY_PATH $PREFIX/$TARGET/lib

out-of-tree: false

config:
  _: ./configure --prefix=$PREFIX
  cross:
    _: ./configure --prefix=$PREFIX/$TARGET --build=$SCBI_HOST --host=$TARGET

build: make -j$SCBI_JOBS

install: make install

prefix:
  _: NONE
  cross:
    #  in $SCBI_PREFIX/$TARGET (--prefix=$PREFIX/$TARGET): found by the cross
    #  compiler
    _: $SCBI_PREFIX

plugin: c-binutils

vcs:
  proxy: default
  options: none
  protocol: git
  url: http://sourceware.org/git/binutils-gdb.git

depends:
  - os@-bison
  - os@-flex
  - os@-makeinfo

build-depends:
  - c-sandbox/system

env:
  - add-to-var PATH $PREFIX/bin
  - add-to-var C_INCLUDE_PATH $PREFIX/include
  - add-to-var LD_LIBRARY_PATH $PREFIX/lib
  - add-to-var LIBRARY_PATH $PREFIX/lib

out-of-tree: true

config-options:
  common:
    - --prefix=$PREFIX
    - --disable-nls
    - --disable-werror
    - --disable-compressed-debug-sections
    - --disable-separate-code
    - --disable-gdb
    - --disable-gdbserver
    - --disable-sim
    - --disable-libquadmath
    - --disable-readline
    - --enable-install-libiberty
  _:
    - --build=$SCBI_HOST
    - --disable-ld
    - --enable-gold
    - --enable-plugins
  cross:
    _:
      #  no --disable-ld: the cross compilers need the linker of the target
      - --target=$TARGET

config: ../src/configure $(config-options)

build: |-
  DEBUG = get-build-type MAKE false
  if $DEBUG == true:
      CFLAGS = -O0
  else:
      CFLAGS = -O2
  CFLAGS += -g -Wno-error
  make -j$SCBI_JOBS CFLAGS="$CFLAGS" CC=gcc

install: make install

version: |-
  TOOL = ld
  if cross:
      TOOL = ${TARGET}-as
      _S1 = command-path $TOOL
      if $_S1 == "":
        TOOL = ${PREFIX}/bin/$TOOL
  _S1 = command-path $TOOL
  if $_S1 == "":
      log 1 $TOOL not found
      echo $VERSION_ERROR
  else:
      V = output $TOOL --version | head -1
      echo ${V##* }

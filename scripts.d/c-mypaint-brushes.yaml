plugin: c-mypaint-brushes

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://github.com/Jehan/mypaint-brushes

build-depends:
  - c-sandbox/system

env:
  - add-to-var PKG_CONFIG_PATH $PREFIX/share/pkgconfig

out-of-tree: false

config: ./autogen.sh && ./configure --prefix=$PREFIX

build: make -j$SCBI_JOBS

install: make install

prefix: /opt/gimp/mypaint-brushes

plugin: c-pipewire

vcs:
  proxy: default
  options: none
  protocol: git
  url: https://gitlab.freedesktop.org/pipewire/pipewire.git

depends:
  - libpulse-dev

build-depends:
  - c-sandbox/system

env:
  - add-to-var PATH $PREFIX/bin

config: meson setup --prefix=$PREFIX . ../src

build: meson compile -C .

install: meson install -C .

prefix: NONE
